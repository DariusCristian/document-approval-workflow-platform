spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/docflow_db
    username: docflow_user
    password: docflow_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080