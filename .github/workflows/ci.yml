name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's downloads and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v6

      # Docker is preinstalled on ubuntu-latest, so Testcontainers can start PostgreSQL.
      - name: Run tests
        run: ./gradlew test

      # Also when tests fail, so the report of that run can be inspected.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Vitest and jsdom need Node 22.13+ or 24; 24 is the current LTS (and what runs locally).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
