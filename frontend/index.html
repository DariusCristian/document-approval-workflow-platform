<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFlow</title>
    <script>
      // Picks light or dark before anything is drawn, so the page never flashes in the wrong theme.
      // Same rules as src/app/theme.ts (key "docflow-theme": "light", "dark", or missing = system).
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('docflow-theme')
        } catch (e) {}
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
